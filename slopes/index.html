<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slopes Dashboard</title>
  <!-- FAVICON -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛷️</text></svg>">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.fullscreen/2.4.0/Control.FullScreen.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.fullscreen/2.4.0/Control.FullScreen.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- CESIUM -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

  <!-- Ion token lives in ion-token.js (gitignored; written by CI from a secret).
       The app degrades to plain satellite-free globe rendering without it. -->
  <script src="ion-token.js"></script>

  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --border: #30363d;
      --accent: #58a6ff;
      --text: #e6edf3;
      --muted: #8b949e;
      --red: #ef4444;
      --green: #22c55e;
      --blue: #3b82f6;
      --black: #111111;
      --lift: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    
    /* HEADER */
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 1000; flex-wrap: wrap; }
    .header-left { display: flex; align-items: center; gap: 16px; cursor: pointer; transition: opacity 0.2s; }
    .header-left:hover { opacity: 0.8; }
    header h1 { font-size: 1.4rem; font-weight: 700; }
    header .subtitle { color: var(--muted); font-size: 0.85rem; }
    .ski-icon { font-size: 1.8rem; }
    
    /* RADIO PLAYER - BIGGER */
    .radio-player { display: flex; align-items: center; gap: 10px; margin-left: 16px; background: var(--surface2); padding: 8px 16px; border-radius: 24px; border: 1px solid var(--border); }
    .btn-radio { background: transparent; border: none; color: var(--text); cursor: pointer; font-size: 0.95rem; font-weight: 600; display: flex; align-items: center; gap: 8px; padding: 4px 8px; }
    .btn-radio.playing { color: var(--accent); animation: pulseText 2s infinite; }
    @keyframes pulseText { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    .volume-slider { width: 80px; accent-color: var(--accent); cursor: pointer; }

    nav { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    nav button, nav a { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; text-decoration: none; display: inline-flex; align-items: center; }
    nav button:hover, nav button.active, nav a:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    
    .lang-switcher { display: flex; background: var(--surface2); border-radius: 6px; overflow: hidden; margin-left: 12px; }
    .lang-btn { background: transparent; border: none; color: var(--muted); padding: 6px 10px; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
    .lang-btn.active { background: var(--accent); color: #fff; }

    /* MAIN */
    main { padding: 24px; max-width: 1600px; margin: 0 auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* STAT CARDS */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; text-align: center; cursor: default; transition: border-color 0.2s, transform 0.2s; display: flex; flex-direction: column; justify-content: center; }
    .stat-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .stat-card .value { font-size: 1.6rem; font-weight: 700; color: var(--accent); line-height: 1.2; margin-bottom: 6px; display: flex; align-items: center; justify-content: center; gap: 6px; word-break: break-word; }
    .stat-card .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; word-break: break-word; line-height: 1.3; }

    /* MAP */
    #overview-map, #cesium-map { height: 750px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); margin-bottom: 24px; z-index: 1; }

    /* RESORT CARDS */
    .resorts-section h2 { font-size: 1.1rem; margin-bottom: 16px; color: var(--text); }
    .resort-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .resort-card { background: var(--surface); border: 2px solid var(--border); border-radius: 12px; padding: 18px; cursor: pointer; transition: all 0.2s; }
    .resort-card:hover, .resort-card.selected { border-color: var(--accent); background: var(--surface2); }
    .resort-card h3 { font-size: 1rem; font-weight: 600; margin-bottom: 8px; }
    .resort-card .days { color: var(--accent); font-size: 0.85rem; margin-bottom: 6px; }
    .resort-card .mini-stats { display: flex; gap: 12px; flex-wrap: wrap; }
    .resort-card .mini-stat { font-size: 0.75rem; color: var(--muted); }
    .resort-card .mini-stat span { color: var(--text); font-weight: 600; }

    /* DAY DETAILS PANEL */
    #day-details-panel { display: none; margin-top: 24px; }
    #day-details-panel.show { display: block; }
    .days-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    .day-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; cursor: pointer; transition: border-color 0.2s; display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
    .day-card:hover { border-color: var(--accent); }
    .day-card .date-badge { background: var(--accent); color: #fff; border-radius: 8px; padding: 8px 12px; text-align: center; min-width: 60px; }
    .day-card .date-badge .day-num { font-size: 1.4rem; font-weight: 700; line-height: 1; }
    .day-card .date-badge .month { font-size: 0.65rem; text-transform: uppercase; }
    .day-card .day-info { display: flex; gap: 24px; flex-wrap: wrap; align-items: center; }
    .day-card .day-stat { text-align: center; }
    .day-card .day-stat .val { font-weight: 700; font-size: 1.05rem; }
    .day-card .day-stat .lbl { font-size: 0.68rem; color: var(--muted); }
    .run-badges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .run-badge { width: 18px; height: 18px; border-radius: 3px; display: inline-flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 700; color: #fff; }
    .badge-green { background: var(--green); }
    .badge-blue { background: var(--blue); }
    .badge-red { background: var(--red); }
    .badge-black { background: var(--black); border: 1px solid #aaa; }
    .badge-lift { background: #e67e22; color: #000; }

    #selected-day-detail { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; display: none; }
    #selected-day-detail.show { display: block; }
    #selected-day-detail h3 { font-size: 1.2rem; margin-bottom: 16px; }
    .day-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    #day-map { height: 450px; border-radius: 10px; z-index: 1;}
    .action-row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    .btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
    .btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* TOP LISTS */
    .top-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
    .top-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .top-card h3 { padding: 14px 18px; background: var(--surface2); font-size: 0.9rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
    .top-list { list-style: none; }
    .top-item { display: flex; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s; }
    .top-item:last-child { border-bottom: none; }
    .top-item:hover { background: var(--surface2); }
    .top-item .rank { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; margin-right: 12px; flex-shrink: 0; }
    .top-item .rank.rank-number { font-size: 0.85rem; font-weight: 700; background: var(--surface2); border-radius: 50%; color: #fff; width: 28px; height: 28px; margin-right: 16px; margin-left: 2px;}
    .top-item .top-label { flex: 1; font-size: 0.85rem; }
    .top-item .top-sub { font-size: 0.72rem; color: var(--muted); }
    .top-item .top-val { font-weight: 700; color: var(--accent); font-size: 0.95rem; }

    /* CHARTS */
    .chart-container { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; height: 300px; }
    .chart-container h3 { font-size: 0.95rem; margin-bottom: 12px; color: var(--muted); }
    .chart-container canvas { width: 100%; height: calc(100% - 32px); }
    #altitude-chart-wrap { margin-top: 16px; height: 120px; }
    .gen-charts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 24px; }
    .gen-charts-grid.wide { grid-template-columns: 1fr; }

    .loader { display: flex; align-items: center; justify-content: center; padding: 60px; color: var(--muted); font-size: 1rem; }
    .spinner { width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .section-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; margin-top: 32px; }
    .section-header.first { margin-top: 0; }
    .section-header h2 { font-size: 1.2rem; }
    .badge-pill { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px; font-size: 0.75rem; color: var(--muted); }

    .map-legend { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--muted); }
    .legend-line { width: 20px; height: 4px; border-radius: 2px; }
    .legend-lift { background: repeating-linear-gradient(90deg, #fff, #fff 4px, #000 4px, #000 8px); height: 5px; }

    @media (max-width: 900px) { .top-grid { grid-template-columns: 1fr; } .gen-charts-grid { grid-template-columns: 1fr; } }
    @media (max-width: 768px) {
      header { flex-direction: column; align-items: flex-start; }
      nav { margin-left: 0; width: 100%; overflow-x: auto; padding-bottom: 4px; }
      .lang-switcher { margin-left: auto; }
      .radio-player { margin-left: 0; margin-top: 8px; width: 100%; justify-content: space-between; }
      .day-detail-grid { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      #overview-map, #cesium-map { height: 450px; }
      .day-card .day-info { gap: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left" onclick="showTab('overview')" title="Go to Homepage">
      <span class="ski-icon">⛷️</span>
      <div>
        <h1 id="t-app-title">Slopes Dashboard</h1>
        <div class="subtitle" id="header-subtitle"><span id="t-loading">Loading data...</span></div>
      </div>
    </div>
    <div class="radio-player">
      <button id="btn-radio" class="btn-radio" onclick="toggleRadio()">▶️ Radio Tignes</button>
      <input type="range" class="volume-slider" id="radio-volume" min="0" max="1" step="0.05" value="0.2" oninput="changeVolume(this.value)" title="Volume">
      <audio id="audio-tignes" src="https://hosting.studioradiomedia.fr:1705/stream"></audio>
    </div>
    <nav>
      <button class="active" onclick="showTab('overview')" id="t-nav-overview">🏠 Home</button>
      <button onclick="showTab('3d')" id="t-nav-3d">🌍 3D Map</button>
      <button onclick="showTab('stats')" id="t-nav-stats">📊 Statistics</button>
      <a href="/" aria-label="Zurück zum Portfolio">← Portfolio</a>
      <div class="lang-switcher">
        <button class="lang-btn active" onclick="setLang('en')" id="btn-lang-en">EN</button>
        <button class="lang-btn" onclick="setLang('de')" id="btn-lang-de">DE</button>
        <button class="lang-btn" onclick="setLang('fr')" id="btn-lang-fr">FR</button>
      </div>
    </nav>
  </header>

  <main>
    <div class="tab-content active" id="tab-overview">
      <div class="stats-grid" id="global-stats"></div>
      
      <div class="map-legend">
        <div class="legend-item"><div class="legend-line legend-lift"></div> <span id="t-leg-lift">Lifts</span></div>
        <div class="legend-item"><div class="legend-line" style="background:var(--blue)"></div> <span id="t-leg-run">Run (Ski)</span></div>
      </div>
      <div id="overview-map"></div>

      <div class="resorts-section">
        <div class="section-header">
          <h2 id="t-sec-resorts">🏔 Resorts</h2>
          <span class="badge-pill" id="resort-count">–</span>
        </div>
        <div class="resort-grid" id="resort-grid"></div>
      </div>

      <div id="day-details-panel">
        <div class="section-header"><h2 id="resort-detail-title">Days in Resort</h2></div>
        <div class="days-list" id="days-list"></div>
        <div id="selected-day-detail">
          <div class="day-detail-grid">
            <div>
              <h3 id="detail-day-title">Day Detail</h3>
              <div class="stats-grid" id="detail-stats" style="grid-template-columns: repeat(3,1fr);"></div>
              <div id="speed-chart-container"><canvas id="speed-chart" height="120"></canvas></div>
              <div id="altitude-chart-wrap"><canvas id="altitude-chart" height="100"></canvas></div>
              <div class="action-row"><button class="btn" id="playback-btn" onclick="openPlayback()">▶ <span id="t-play-ride">Play Ride</span></button></div>
            </div>
            <div>
              <div id="day-map"></div>
              <div id="run-breakdown" style="margin-top:16px;"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="section-header"><h2 id="t-sec-top">🏆 Top Lists</h2></div>
      <div class="top-grid" id="top-grid"></div>
    </div>

    <div class="tab-content" id="tab-3d">
      <div class="stats-grid" id="global-stats-3d"></div>
      <div class="map-legend">
        <div class="legend-item"><div class="legend-line" style="background:#fff; border:1px dashed #888;"></div> <span>Lifts (White Dashed)</span></div>
        <div class="legend-item"><div class="legend-line" style="background:var(--blue)"></div> <span>Run (Blue)</span></div>
      </div>
      <div id="cesium-map"></div>
    </div>

    <div class="tab-content" id="tab-stats">
      <div class="section-header first"><h2 id="t-sec-gen-stats">📊 General Statistics</h2></div>
      <div class="stats-grid" id="gen-stats-row"></div>
      <div class="gen-charts-grid" id="gen-charts"></div>
      <div class="gen-charts-grid" id="gen-charts-row2" style="margin-top:20px;"></div>
    </div>
  </main>

  <div id="playback-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:2000; padding:24px; flex-direction:column;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h2 id="playback-title" style="font-size:1.1rem; color:white;">Ride Playback</h2>
      <button class="btn" onclick="closePlayback()">✕ <span id="t-btn-close">Close</span></button>
    </div>
    <div id="playback-map" style="flex:1; border-radius:12px; border:1px solid var(--border); min-height:400px;"></div>
    <div class="playback-controls">
      <button class="btn" id="play-pause-btn" onclick="togglePlayback()">▶ Play</button>
      <input type="range" id="playback-slider" min="0" value="0" step="1" oninput="seekPlayback(this.value)">
      <span id="playback-time" style="color:white;">00:00</span>
      <label style="font-size:0.8rem; color:var(--muted);" id="t-lbl-speed">Speed:</label>
      <select id="playback-speed" onchange="changePlaybackSpeed(this.value)">
        <option value="1">1x</option><option value="5" selected>5x</option><option value="20">20x</option><option value="60">60x</option>
      </select>
    </div>
  </div>

  <script>
  // Populated by ion-token.js (local dev) or the deploy workflow (CI).
  // A missing token is not fatal: init3DMap() falls back to a token-free globe.
  if (window.ION_TOKEN && window.Cesium) Cesium.Ion.defaultAccessToken = window.ION_TOKEN;

  // =====================
  // i18n
  // =====================
  const I18N = {
    'en': {
      'app_title': 'Slopes Dashboard', 'loading': 'Loading data...', 'loading_days': 'Loading {0}/{1} ski days...',
      'nav_overview': '🏠 Home', 'nav_3d': '🌍 3D Map', 'nav_stats': '📊 Statistics', 'sec_resorts': '🏔 Resorts', 'sec_top': '🏆 Top Lists', 
      'sec_gen_stats': '📊 General Statistics', 'days': 'Days', 'day': 'Day', 'stat_days': 'Ski Days', 'stat_dist': 'Total Distance', 'stat_vert': 'Vertical Drop',
      'stat_max_spd': 'Top Speed', 'stat_runs': 'Runs', 'stat_lifts': 'Lifts', 'stat_resorts': 'Resorts', 'stat_avg_dist': 'Ø Distance / Day',
      'total': 'Total', 'play_ride': 'Play Ride', 'btn_close': 'Close', 'lbl_speed': 'Speed:',
      'top_km': '🏅 Top 5 Distance', 'top_vert': '⛰️ Top 5 Vertical', 'top_spd': '⚡ Top 5 Speed', 'top_runs': '🎿 Top 5 Runs', 
      'top_lifts': '🚡 Top 5 Lifts', 'top_weekdays': '📅 Most Frequent Weekdays',
      'c_km_day': 'Distance per Day', 'c_m_day': 'Vertical per Day', 'c_km_resort': 'Distance per Resort',
      'c_spd_day': 'Top Speed per Day', 'c_month': 'Ski Days by Month', 'c_avg_time': 'Avg Time on Slopes', 'c_runs_day': 'Total Runs per Day',
      'duration': 'Duration', 'max_alt': 'Max Altitude', 'conditions': 'Conditions',
      'leg_lift': 'Lifts', 'leg_run': 'Skiing Run'
    },
    'de': {
      'app_title': 'Slopes Dashboard', 'loading': 'Lade Daten...', 'loading_days': 'Lade {0}/{1} Skitage...',
      'nav_overview': '🏠 Home', 'nav_3d': '🌍 3D Karte', 'nav_stats': '📊 Statistiken', 'sec_resorts': '🏔 Skigebiete', 'sec_top': '🏆 Top Listen', 
      'sec_gen_stats': '📊 Allgemeine Statistiken', 'days': 'Tage', 'day': 'Tag', 'stat_days': 'Skitage', 'stat_dist': 'Kilometer gesamt', 'stat_vert': 'Höhenmeter',
      'stat_max_spd': 'Höchstgeschwindigkeit', 'stat_runs': 'Abfahrten', 'stat_lifts': 'Liftfahrten', 'stat_resorts': 'Skigebiete', 'stat_avg_dist': 'Ø km / Tag',
      'total': 'Gesamt', 'play_ride': 'Fahrt abspielen', 'btn_close': 'Schließen', 'lbl_speed': 'Geschw.:',
      'top_km': '🏅 Top 5 nach Kilometern', 'top_vert': '⛰️ Top 5 nach Höhenmetern', 'top_spd': '⚡ Top 5 Höchstgeschwindigkeiten', 'top_runs': '🎿 Top 5 nach Abfahrten', 
      'top_lifts': '🚡 Top 5 nach Liftfahrten', 'top_weekdays': '📅 Häufigste Wochentage',
      'c_km_day': 'Kilometer pro Tag', 'c_m_day': 'Höhenmeter pro Tag', 'c_km_resort': 'Km pro Skigebiet',
      'c_spd_day': 'Max Speed pro Tag', 'c_month': 'Skitage nach Monat', 'c_avg_time': 'Ø Zeit auf Piste', 'c_runs_day': 'Abfahrten pro Tag',
      'duration': 'Fahrzeit', 'max_alt': 'Max Höhe', 'conditions': 'Bedingungen',
      'leg_lift': 'Lifte', 'leg_run': 'Abfahrt'
    },
    'fr': {
      'app_title': 'Tableau de bord Slopes', 'loading': 'Chargement...', 'loading_days': 'Chargement {0}/{1} jours...',
      'nav_overview': '🏠 Home', 'nav_3d': '🌍 Carte 3D', 'nav_stats': '📊 Statistiques', 'sec_resorts': '🏔 Stations', 'sec_top': '🏆 Tops', 
      'sec_gen_stats': '📊 Stats générales', 'days': 'Jours', 'day': 'Jour', 'stat_days': 'Jours de ski', 'stat_dist': 'Distance Totale', 'stat_vert': 'Dénivelé',
      'stat_max_spd': 'Vitesse Max', 'stat_runs': 'Pistes', 'stat_lifts': 'Remontées', 'stat_resorts': 'Stations', 'stat_avg_dist': 'Ø km / Jour',
      'total': 'Total', 'play_ride': 'Jouer la trace', 'btn_close': 'Fermer', 'lbl_speed': 'Vitesse:',
      'top_km': '🏅 Top 5 par Distance', 'top_vert': '⛰️ Top 5 par Dénivelé', 'top_spd': '⚡ Top 5 Vitesses Max', 'top_runs': '🎿 Top 5 par Pistes', 
      'top_lifts': '🚡 Top 5 par Remontées', 'top_weekdays': '📅 Jours de la Semaine',
      'c_km_day': 'Kilomètres par Jour', 'c_m_day': 'Dénivelé par Jour', 'c_km_resort': 'Km par Station',
      'c_spd_day': 'Vitesse Max par Jour', 'c_month': 'Jours de Ski par Mois', 'c_avg_time': 'Temps Moyen', 'c_runs_day': 'Pistes par Jour',
      'duration': 'Durée', 'max_alt': 'Altitude Max', 'conditions': 'Conditions',
      'leg_lift': 'Remontées', 'leg_run': 'Pistes (Ski)'
    }
  };

  let currentLang = 'en';
  function t(key) { return I18N[currentLang][key] || key; }

  const DATA_BASE = './app_data';
  let allDays = [], overviewMap = null, dayMap = null, playbackMap = null, cesiumViewer = null, speedChartInst = null, altChartInst = null;
  let playbackInterval = null, playbackIdx = 0, playbackData = [], playbackMarker = null, playbackPolyline = null, playbackTrailCoords = [], currentDayData = null, playbackSpeed = 5;

  const mapLayerStyles = {
    'OSM': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }),
    'Topo': L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17 }),

  /* Tour folders are enumerated from app_data/manifest.json, generated from the
     folders that actually exist. The app used to ask a server-side script for
     the list, which works on a PHP host and 404s on static hosting -- where it
     fell back to a hardcoded array holding 4 of 31 tours, so the other 27 never
     loaded and nothing reported it. Kept as an emergency net in case the
     manifest itself fails to fetch: a short day list beats an empty screen. */
  const FALLBACK_FOLDERS = ["December 01 2025 - Tignes - Val d'Isère", "December 18 2022 - Les 3 Vallées", "January 03 2024 - Paradiski", "February 08 2026 - Galibier - Thabor"];

  async function loadFolderList() {
    try {
      const r = await fetch(`${DATA_BASE}/manifest.json`, { cache: 'no-cache' });
      if (r.ok) {
        const list = await r.json();
        if (Array.isArray(list) && list.length > 0) return list;
      }
    } catch (e) { /* fall through to the fallback list */ }
    return FALLBACK_FOLDERS;
  }

  function parseFolder(name) {
    const parts = name.split(' - ');
    if (parts.length < 2) return { folder: name, resort: name, date: new Date(name) || new Date(), dateStr: name };
    return { folder: name, resort: parts.slice(1).join(' - ').trim(), date: new Date(parts[0].trim()), dateStr: parts[0].trim() };
  }

  async function loadMetadata(folder) {
    try {
      const r = await fetch(`${DATA_BASE}/${encodeURIComponent(folder)}/Metadata.xml`); if (!r.ok) return null;
      const doc = new DOMParser().parseFromString(await r.text(), 'text/xml'), act = doc.querySelector('Activity'); if (!act) return null;
      const actions = Array.from(doc.querySelectorAll('Action')), runs = actions.filter(a => a.getAttribute('type') === 'Run');
      return {
        distance: parseFloat(act.getAttribute('distance') || 0) / 1000, vertical: parseFloat(act.getAttribute('vertical') || 0),
        topSpeed: parseFloat(act.getAttribute('topSpeed') || 0) * 3.6, start: act.getAttribute('start'), end: act.getAttribute('end'),
        centerLat: parseFloat(act.getAttribute('centerLat') || 0), centerLong: parseFloat(act.getAttribute('centerLong') || 0),
        peakAlt: parseFloat(act.getAttribute('peakAltitude') || 0), conditions: act.getAttribute('conditions') || '',
        numRuns: runs.length, numLifts: actions.filter(a => a.getAttribute('type') === 'Lift').length, runs: categorizeRuns(runs)
      };
    } catch(e) { return null; }
  }

  function categorizeRuns(runs) {
    let green=0, blue=0, red=0, black=0;
    runs.forEach(r => { const spd = parseFloat(r.getAttribute('topSpeed') || 0)*3.6; if(spd<20) green++; else if(spd<40) blue++; else if(spd<65) red++; else black++; });
    return { green, blue, red, black };
  }

  async function loadGPS(folder) {
    try {
      let r = await fetch(`${DATA_BASE}/${encodeURIComponent(folder)}/GPS.csv`); if (!r.ok) r = await fetch(`${DATA_BASE}/${encodeURIComponent(folder)}/rawGPS.csv`); if (!r.ok) return [];
      return (await r.text()).trim().split('\n').map(line => {
        const cols = line.split(','); return { t: parseFloat(cols[0]), lat: parseFloat(cols[1]), lon: parseFloat(cols[2]), alt: parseFloat(cols[3]), speed: parseFloat(cols[5]) * 3.6 };
      }).filter(p => !isNaN(p.lat) && !isNaN(p.lon) && p.speed >= 0);
    } catch(e) { return []; }
  }

  function segmentGPS(gps) {
    if (!gps || gps.length === 0) return [];
    const segments = []; let current = [gps[0]], state = 'unknown', extremeAlt = gps[0].alt;
    for (let i = 1; i < gps.length; i++) {
        const p = gps[i]; current.push(p);
        if (state === 'unknown') {
            if (p.alt - extremeAlt > 20) { state = 'lift'; extremeAlt = p.alt; }
            else if (extremeAlt - p.alt > 20) { state = 'run'; extremeAlt = p.alt; }
            else { if (p.alt > extremeAlt) extremeAlt = p.alt; else if (p.alt < extremeAlt) extremeAlt = p.alt; }
        }
        if (state === 'lift') {
            if (p.alt > extremeAlt) extremeAlt = p.alt;
            if (extremeAlt - p.alt > 25) { 
                let peakIdx = current.length - 1, maxA = -9999; for(let j=0; j<current.length; j++){ if(current[j].alt > maxA) { maxA = current[j].alt; peakIdx = j; } }
                segments.push({ type: 'lift', points: current.slice(0, peakIdx + 1) }); current = current.slice(peakIdx); state = 'run'; extremeAlt = current[0].alt;
            }
        } else if (state === 'run') {
            if (p.alt < extremeAlt) extremeAlt = p.alt;
            if (p.alt - extremeAlt > 25) { 
                let valIdx = current.length - 1, minA = 99999; for(let j=0; j<current.length; j++){ if(current[j].alt < minA) { minA = current[j].alt; valIdx = j; } }
                segments.push({ type: 'run', points: current.slice(0, valIdx + 1) }); current = current.slice(valIdx); state = 'lift'; extremeAlt = current[0].alt;
            }
        }
    }
    if (current.length > 1) segments.push({ type: state === 'unknown' ? 'run' : state, points: current });
    return segments;
  }

  function drawSegments(mapObj, segments, opacity=0.8) {
    segments.forEach(seg => {
        const coords = seg.points.map(p => [p.lat, p.lon]);
        if (seg.type === 'lift') {
            L.polyline(coords, { color: '#ffffff', weight: 4, opacity }).addTo(mapObj);
            L.polyline(coords, { color: '#000000', weight: 4, opacity, dashArray: '5, 10' }).addTo(mapObj);
        } else {
            L.polyline(coords, { color: 'var(--blue)', weight: 4, opacity }).addTo(mapObj);
        }
    });
  }

  function drawCesiumSegments(viewer, segments) {
    segments.forEach(seg => {
        const positions = seg.points.map(p => Cesium.Cartesian3.fromDegrees(p.lon, p.lat, p.alt + 5));
        if (seg.type === 'lift') {
            viewer.entities.add({ polyline: { positions, width: 4, material: new Cesium.PolylineDashMaterialProperty({ color: Cesium.Color.WHITE, dashLength: 10 }), clampToGround: false } });
        } else {
            viewer.entities.add({ polyline: { positions, width: 4, material: Cesium.Color.DODGERBLUE, clampToGround: false } });
        }
    });
  }

  async function init() {
    overviewMap = L.map('overview-map', { zoomControl: true, fullscreenControl: true, layers: [mapLayerStyles['OSM']] }).setView([45.5, 7.0], 8);
    L.control.layers(mapLayerStyles).addTo(overviewMap);

    const loaderEl = document.createElement('div'); loaderEl.className = 'loader'; loaderEl.innerHTML = `<div class="spinner"></div> ${t('loading')}`; document.getElementById('global-stats').appendChild(loaderEl);

    const foldersToLoad = await loadFolderList();

    let loaded = 0, allCoordsForOverview = [];
    for (const folder of foldersToLoad) {
      const info = parseFolder(folder), meta = await loadMetadata(folder);
      if (meta) {
        allDays.push({ ...info, meta }); const gps = await loadGPS(folder);
        if (gps.length > 0) { allCoordsForOverview.push(...gps.map(p => [p.lat, p.lon])); drawSegments(overviewMap, segmentGPS(gps), 0.65); }
        if (meta.centerLat && meta.centerLong) { L.circleMarker([meta.centerLat, meta.centerLong], { radius: 6, fillColor: 'var(--accent)', color: '#fff', weight: 2, fillOpacity: 0.9 }).addTo(overviewMap).bindTooltip(`<b>${info.resort}</b><br>${info.dateStr}<br>${meta.distance.toFixed(1)} km`); }
      }
      loaded++; loaderEl.innerHTML = `<div class="spinner"></div> ${t_format('loading_days', loaded, foldersToLoad.length)}`;
    }
    if (allCoordsForOverview.length > 0) overviewMap.fitBounds(L.polyline(allCoordsForOverview).getBounds());
    loaderEl.remove(); setLang('en');
  }

  async function init3DMap() {
    if (cesiumViewer) return;
    try {
      const hasIon = Boolean(window.ION_TOKEN);
      const viewerOptions = {
        baseLayerPicker: true,
        timeline: false,
        animation: false
      };
      if (hasIon) {
        viewerOptions.terrainProvider = await Cesium.CesiumTerrainProvider.fromIonAssetId(1);
      } else {
        // No token configured: keep the demo usable with token-free sources
        // instead of failing every Ion request.
        viewerOptions.terrainProvider = new Cesium.EllipsoidTerrainProvider();
        viewerOptions.baseLayer = new Cesium.ImageryLayer(
          new Cesium.OpenStreetMapImageryProvider({ url: 'https://tile.openstreetmap.org/' })
        );
      }
      cesiumViewer = new Cesium.Viewer('cesium-map', viewerOptions);
      for (const d of allDays) {
        const gps = await loadGPS(d.folder);
        if (gps.length > 0) drawCesiumSegments(cesiumViewer, segmentGPS(gps));
      }
      
      if (allDays.length > 0 && allDays[0].meta.centerLat) {
        cesiumViewer.camera.flyTo({ 
          destination: Cesium.Cartesian3.fromDegrees(allDays[0].meta.centerLong, allDays[0].meta.centerLat, 15000), 
          orientation: { heading: 0, pitch: Cesium.Math.toRadians(-45), roll: 0 } 
        });
      }
    } catch(e) {
      console.error('Cesium initialization error:', e);
      document.getElementById('cesium-map').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);">Failed to load 3D map. Please check console for details.</div>';
    }
  }

  async function selectDay(folder) {

    const day = allDays.find(d => d.folder === folder); if (!day) return;
    const m = day.meta, detailEl = document.getElementById('selected-day-detail'); detailEl.classList.add('show');
    document.getElementById('detail-day-title').textContent = `🎿 ${day.resort} — ${day.dateStr}`;

    const dur = m?.start && m?.end ? formatDuration(new Date(m.end) - new Date(m.start)) : '?';
    document.getElementById('detail-stats').innerHTML = [
      { v: `${m?.distance?.toFixed(2)} km`, l: 'Km' }, { v: `${m?.vertical?.toFixed(0)} m`, l: t('stat_vert') },
      { v: `${m?.topSpeed?.toFixed(1)} km/h`, l: 'Max Speed' }, { v: dur, l: t('duration') },
      { v: m?.numRuns || 0, l: t('stat_runs') }, { v: m?.numLifts || 0, l: t('stat_lifts') },
      { v: `${m?.peakAlt?.toFixed(0)} m`, l: t('max_alt') }, { v: m?.conditions || '–', l: t('conditions') },
    ].map(s => `<div class="stat-card"><div class="value" style="font-size:1.1rem">${s.v}</div><div class="label" style="font-size:0.65rem">${s.l}</div></div>`).join('');

    currentDayData = { folder, day }; const gps = await loadGPS(folder); currentDayData.gps = gps;
    if (!dayMap) {

      L.control.layers(mapLayerStyles).addTo(dayMap);
    } else { dayMap.eachLayer(l => { if (!(l instanceof L.TileLayer)) dayMap.removeLayer(l); }); }
    
    if (gps.length > 0) { drawSegments(dayMap, segmentGPS(gps), 0.9); dayMap.fitBounds(gps.map(p => [p.lat, p.lon])); }

    const sample = sampleArray(gps, 200), times = sample.map(p => { const d = new Date(p.t * 1000); return `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`; });

    if (altChartInst) altChartInst.destroy();

  function openPlayback() {
    if (!currentDayData?.gps?.length) return;
    document.getElementById('playback-overlay').style.display = 'flex';

      playbackMap = L.map('playback-map', { layers: [mapLayerStyles['OSM']]}).setView([45.5, 7.0], 13); 
      L.control.layers(mapLayerStyles).addTo(playbackMap); 
    } else { 
      playbackMap.eachLayer(l => { if (!(l instanceof L.TileLayer)) playbackMap.removeLayer(l); }); 
    }

    playbackData = currentDayData.gps; playbackIdx = 0; playbackTrailCoords = []; document.getElementById('playback-slider').max = playbackData.length - 1; document.getElementById('playback-slider').value = 0;

    const allCoords = playbackData.map(p => [p.lat, p.lon]);
    L.polyline(allCoords, { color: '#30363d', weight: 2, opacity: 0.5 }).addTo(playbackMap); playbackMap.fitBounds(allCoords);
    playbackPolyline = L.polyline([], { color: 'var(--accent)', weight: 3 }).addTo(playbackMap);

  function togglePlayback() {

    else { btn.textContent = '⏸ Pause'; playbackInterval = setInterval(() => { playbackIdx += playbackSpeed; if (playbackIdx >= playbackData.length) { stopPlayback(); btn.textContent = '▶ Play'; return; } updatePlaybackPos(playbackIdx); }, 50); }
  }
  function stopPlayback() { clearInterval(playbackInterval); playbackInterval = null; }
  function seekPlayback(val) { playbackIdx = parseInt(val); updatePlaybackPos(playbackIdx); }
  function updatePlaybackPos(idx) {
    const p = playbackData[idx]; if (!p) return;
    playbackTrailCoords.push([p.lat, p.lon]); if (playbackTrailCoords.length > 500) playbackTrailCoords.shift();
    playbackPolyline.setLatLngs(playbackTrailCoords); playbackMarker.setLatLng([p.lat, p.lon]); document.getElementById('playback-slider').value = idx; updatePlaybackTime(idx);
  }

    const medals = ['🥇', '🥈', '🥉', '4', '5'];
    const lists = [
      { title: t('top_km'), data: s_km.slice(0,5), val: d => `${d.meta?.distance?.toFixed(1)} km`, sub: d => d.resort },
      { title: t('top_vert'), data: s_vt.slice(0,5), val: d => `${(d.meta?.vertical||0).toFixed(0)} m`, sub: d => d.resort },
      { title: t('top_spd'), data: s_sp.slice(0,5), val: d => `${d.meta?.topSpeed?.toFixed(1)} km/h`, sub: d => d.resort },
      { title: t('top_runs'), data: s_rn.slice(0,5), val: d => `${d.meta?.numRuns}`, sub: d => d.resort },
      { title: t('top_lifts'), data: s_lf.slice(0,5), val: d => `${d.meta?.numLifts}`, sub: d => d.resort },
      { title: t('top_weekdays'), isWd: true, data: wdData, val: d => `${d.count} days`, sub: () => '' }
    ];

    el.innerHTML = lists.map(tc => `<div class="top-card"><h3>${tc.title}</h3><ul class="top-list">
          ${tc.data.map((d, i) => `<li class="top-item" ${tc.isWd ? '' : `onclick="jumpToDay('${d.folder.replace(/'/g,"\\'")}')"`}>
              ${i<3 ? `<span class="rank">${medals[i]}</span>` : `<span class="rank rank-number">${medals[i]}</span>`}
              <div class="top-label">${tc.isWd ? d.name : formatDate(d.date)} <div class="top-sub">${tc.sub(d)}</div></div>
              <div class="top-val">${tc.val(d)}</div></li>`).join('')}
        </ul></div>`).join('');
  }

  function jumpToDay(folder) { const day = allDays.find(d => d.folder === folder); if (!day) return; selectResort(day.resort); setTimeout(() => selectDay(folder), 300); }

  function renderGenStats() {
    const totalKm = allDays.reduce((s, d) => s + (d.meta?.distance || 0), 0), totalVert = allDays.reduce((s, d) => s + (d.meta?.vertical || 0), 0);
    const maxSpd = Math.max(...allDays.map(d => d.meta?.topSpeed || 0));
    const totalTime = allDays.reduce((s, d) => s + (d.meta?.start && d.meta?.end ? (new Date(d.meta.end) - new Date(d.meta.start)) : 0), 0);
    const avgTimeHrs = (totalTime / allDays.length / 3600000).toFixed(1);
    
    document.getElementById('gen-stats-row').innerHTML = [
      { v: `${totalKm.toFixed(1)} <span style="font-size:1rem">km</span>`, l: t('stat_dist') }, 
      { v: `${(totalVert/1000).toFixed(1)} <span style="font-size:1rem">km</span>`, l: t('stat_vert') },
      { v: `${maxSpd.toFixed(1)} <span style="font-size:1rem">km/h</span>`, l: t('stat_max_spd') }, 
      { v: allDays.reduce((s, d) => s + (d.meta?.numRuns || 0), 0), l: t('stat_runs') }, 
      { v: allDays.reduce((s, d) => s + (d.meta?.numLifts || 0), 0), l: t('stat_lifts') },
      { v: `${avgTimeHrs} <span style="font-size:1rem">h</span>`, l: t('c_avg_time') }
    ].map(s => `<div class="stat-card"><div class="value">${s.v}</div><div class="label">${s.l}</div></div>`).join('');

    document.getElementById('gen-charts').innerHTML = `<div class="chart-container"><h3>${t('c_km_day')}</h3><canvas id="km-chart"></canvas></div><div class="chart-container"><h3>${t('c_m_day')}</h3><canvas id="vert-chart"></canvas></div><div class="chart-container"><h3>${t('c_km_resort')}</h3><canvas id="resort-chart"></canvas></div>`;
    document.getElementById('gen-charts-row2').innerHTML = `<div class="chart-container"><h3>${t('c_spd_day')}</h3><canvas id="spd-chart"></canvas></div><div class="chart-container"><h3>${t('c_runs_day')}</h3><canvas id="runs-chart"></canvas></div><div class="chart-container"><h3>${t('c_month')}</h3><canvas id="month-chart"></canvas></div>`;

    const sortedDays = [...allDays].sort((a, b) => a.date - b.date), labels = sortedDays.map(d => formatDate(d.date));
    const chartDefaults = { plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#8b949e' }, grid: { color: '#21262d' } }, y: { ticks: { color: '#8b949e' }, grid: { color: '#21262d' } } }, responsive: true, maintainAspectRatio: false };
    const chartColors = { backgroundColor: 'rgba(88,166,255,0.8)', hoverBackgroundColor: '#58a6ff', borderRadius: 4 };

    new Chart(document.getElementById('km-chart').getContext('2d'), { type: 'bar', data: { labels, datasets: [{ data: sortedDays.map(d => d.meta?.distance?.toFixed(1)), ...chartColors }] }, options: chartDefaults });
    new Chart(document.getElementById('vert-chart').getContext('2d'), { type: 'bar', data: { labels, datasets: [{ data: sortedDays.map(d => d.meta?.vertical), backgroundColor: 'rgba(34,197,94,0.8)', hoverBackgroundColor: '#22c55e', borderRadius: 4 }] }, options: chartDefaults });
    new Chart(document.getElementById('spd-chart').getContext('2d'), { type: 'bar', data: { labels, datasets: [{ data: sortedDays.map(d => d.meta?.topSpeed), backgroundColor: 'rgba(239,68,68,0.8)', hoverBackgroundColor: '#ef4444', borderRadius: 4 }] }, options: chartDefaults });
    new Chart(document.getElementById('runs-chart').getContext('2d'), { type: 'bar', data: { labels, datasets: [{ data: sortedDays.map(d => d.meta?.numRuns), backgroundColor: 'rgba(168,85,247,0.8)', hoverBackgroundColor: '#a855f7', borderRadius: 4 }] }, options: chartDefaults });

    const resorts = getResorts();
    new Chart(document.getElementById('resort-chart').getContext('2d'), { type: 'doughnut', data: { labels: resorts.map(r => r.name), datasets: [{ data: resorts.map(r => r.days.reduce((s, d) => s + (d.meta?.distance || 0), 0)), backgroundColor: ['#58a6ff', '#22c55e', '#f0a500', '#bc8cff', '#ef4444'], borderWidth: 0 }] }, options: { plugins: { legend: { position: 'right', labels: { color: '#8b949e' } } }, responsive: true, maintainAspectRatio: false } });

    const monthCounts = {}; allDays.forEach(d => { const m = new Date(d.date).toLocaleString(currentLang, {month:'long'}); monthCounts[m] = (monthCounts[m]||0) + 1; });
    new Chart(document.getElementById('month-chart').getContext('2d'), { type: 'pie', data: { labels: Object.keys(monthCounts), datasets: [{ data: Object.values(monthCounts), backgroundColor: ['#bc8cff', '#58a6ff', '#22c55e', '#f0a500', '#ef4444', '#ec4899', '#6366f1'], borderWidth: 0 }] }, options: { plugins: { legend: { position: 'right', labels: { color: '#8b949e' } } }, responsive: true, maintainAspectRatio: false } });
  }

  function showTab(tab) { 
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active')); 
    document.querySelectorAll('nav > button').forEach(b => b.classList.remove('active')); 
    document.getElementById('tab-' + tab).classList.add('active'); 
    document.getElementById('t-nav-' + tab).classList.add('active'); 
    setTimeout(() => { 
      if (overviewMap) overviewMap.invalidateSize(); 
      if (tab === '3d') init3DMap();
    }, 100); 
  }
  function formatDuration(ms) { const h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000); return `${h}h ${m}m`; }
  function sampleArray(arr, n) { if (arr.length <= n) return arr; const step = Math.floor(arr.length / n); return arr.filter((_, i) => i % step === 0).slice(0, n); }

  window.addEventListener('load', init);
  </script>
</body>
</html>
