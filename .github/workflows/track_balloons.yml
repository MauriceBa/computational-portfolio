name: Track Balloons

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Never run two scans at once; do not cancel mid-commit.
concurrency:
  group: balloon-tracker
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scanner
        run: pip install --quiet FlightRadarAPI==1.3.34

      - name: Scan active balloons
        run: python hot-air-balloon-tracking/tracker.py

      - name: Commit fresh data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'hot-air-balloon-tracking/app-data/balloon_*.json'
          if git diff --cached --quiet; then
            echo "No data changes, skipping commit"
          else
            git commit -m "data: balloon scan $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
